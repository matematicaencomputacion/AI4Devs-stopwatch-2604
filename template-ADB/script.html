<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporizador · Flip Clock</title>

  <!-- Fuentes: precarga de conexiones + hoja externa (paraleliza la descarga) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Martian+Mono:wght@500;700&display=swap">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <h1><span class="dot"></span>Temporizador</h1>
        <p id="mode-label">Cronómetro de precisión</p>
      </div>
      <button class="mute" id="mute" title="Silenciar sonido" aria-label="Silenciar sonido">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
      </button>
    </header>

    <nav class="tabs" role="tablist" aria-label="Modo del temporizador">
      <div class="tab-slider" id="slider" aria-hidden="true"></div>
      <button class="active" id="tab-stopwatch" data-mode="stopwatch" role="tab" aria-selected="true" aria-controls="panel-stopwatch">Cronómetro</button>
      <button id="tab-countdown" data-mode="countdown" role="tab" aria-selected="false" aria-controls="panel-countdown">Cuenta regresiva</button>
    </nav>

    <div class="clock-wrap">
      <div class="clock" id="clock">
        <div class="group">
          <div class="flip" data-i="0"></div>
          <div class="flip" data-i="1"></div>
        </div>
        <div class="colon" id="colon-1"><span></span><span></span></div>
        <div class="group">
          <div class="flip" data-i="2"></div>
          <div class="flip" data-i="3"></div>
        </div>
        <div class="colon" id="colon-2"><span></span><span></span></div>
        <div class="group">
          <div class="flip" data-i="4"></div>
          <div class="flip" data-i="5"></div>
        </div>
      </div>
      <div class="cs" id="cs">.00</div>
    </div>

    <!-- CRONÓMETRO -->
    <section class="panel" id="panel-stopwatch" role="tabpanel" aria-labelledby="tab-stopwatch">
      <div class="controls">
        <button class="btn primary" id="sw-main">
          <svg id="sw-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <span id="sw-main-t">Iniciar</span>
        </button>
        <button class="btn" id="sw-lap" disabled>Vuelta</button>
        <button class="btn" id="sw-reset" disabled>Reiniciar</button>
      </div>
      <div class="laps" id="laps"></div>
    </section>

    <!-- CUENTA REGRESIVA -->
    <section class="panel" id="panel-countdown" role="tabpanel" aria-labelledby="tab-countdown" hidden>
      <div class="setter" id="setter">
        <div class="stepper">
          <button class="chev" data-step="h" data-d="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button>
          <label>Horas</label>
          <button class="chev" data-step="h" data-d="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
        <div class="stepper">
          <button class="chev" data-step="m" data-d="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button>
          <label>Minutos</label>
          <button class="chev" data-step="m" data-d="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
        <div class="stepper">
          <button class="chev" data-step="s" data-d="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button>
          <label>Segundos</label>
          <button class="chev" data-step="s" data-d="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
      </div>
      <div class="presets" id="presets">
        <button class="chip" data-sec="60">1 min</button>
        <button class="chip" data-sec="300">5 min</button>
        <button class="chip" data-sec="600">10 min</button>
        <button class="chip" data-sec="1500">25 min</button>
        <button class="chip" data-sec="3600">1 h</button>
      </div>
      <div class="controls">
        <button class="btn primary" id="cd-main" disabled>
          <svg id="cd-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <span id="cd-main-t">Iniciar</span>
        </button>
        <button class="btn" id="cd-reset" disabled>Reiniciar</button>
      </div>
      <div class="finish-msg" id="finish">¡Tiempo!</div>
    </section>

    <p class="hint"><kbd>Espacio</kbd> iniciar/pausar · <kbd>R</kbd> reiniciar · <kbd>L</kbd> vuelta</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
